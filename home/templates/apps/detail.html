{% extends 'apps/base.html' %}
{% block title %}Chi tiết sản phẩm{% endblock %}

{% block detail %}
<div class="container mt-5 mb-5">
    {% for product in products %}
    <div class="card mb-5 p-4 shadow">
        <div class="row">
            <!-- Product Image Section -->
            <div class="col-md-6">
                <div class="text-center p-3">
                    <img id="main-image" src="{{ product.imageURL }}" class="img-fluid rounded" alt="Product Image" width="300">
                </div>
            </div>

            <!-- Product Information Section -->
            <div class="col-md-6">
                <div class="product-details">
                    <!-- Back Button & Cart Icon -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <a class="btn btn-outline-dark" href="{% url 'hotel' %}">&#x2190; Back</a>
                        <a href="{% url 'cart' %}" class="text-muted">
                            <i class="fa fa-shopping-cart"></i>
                        </a>
                    </div>

                    <!-- Product Title & Price -->
                    <h2 class="text-uppercase font-weight-bold">{{ product.name }}</h2>
                    <p class="text-muted mb-2">{{ product.category }}</p>
                    <div class="price mb-4">
                        <span class="text-success h4">{{ product.price }}$</span>
                    </div>

                    <!-- Product Description -->
                    <p class="about mb-4">{{ product.detail }}</p>

                    <!-- Add to Cart Button -->
                    <button class="btn btn-danger text-uppercase add-btn update-cart" data-product="{{ product.id }}" data-action="add">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock detail %}
